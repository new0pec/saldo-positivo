<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Saldo Positivo</title>
  <defs>
    <filter id="campos" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="vidro" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="sombra" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000" flood-opacity="0.35"/></filter>
    <filter id="brilho" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#5ee8b5" flood-opacity="0.5"/></filter>
    <clipPath id="vidroForma"><rect x="212" y="212" width="600" height="600" rx="150"/></clipPath>
    <g id="cor">
      <circle cx="190" cy="170" r="310" fill="#12a37a" opacity="0.95"/>
      <circle cx="860" cy="200" r="300" fill="#2f4fd1" opacity="0.95"/>
      <circle cx="460" cy="880" r="280" fill="#c2416f" opacity="0.9"/>
      <circle cx="850" cy="850" r="150" fill="#d98a1f" opacity="0.55"/>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="#0b1022"/>
  <use href="#cor" filter="url(#campos)"/>
  <!-- vidro: cópia mais desfocada do fundo, recortada, com tinta escura -->
  <rect x="212" y="212" width="600" height="600" rx="150" fill="#0b1022" filter="url(#sombra)" opacity="0.6"/>
  <g clip-path="url(#vidroForma)">
    <rect width="1024" height="1024" fill="#0b1022"/>
    <use href="#cor" filter="url(#campos)"/>
    <rect width="1024" height="1024" fill="#0e142c" opacity="0.30"/>
    <rect x="212" y="212" width="600" height="4" fill="#fff" opacity="0.35"/>
  </g>
  <rect x="214" y="214" width="596" height="596" rx="148" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="4"/>
  <rect x="362" y="470" width="300" height="84" rx="42" fill="#fff"/>
  <rect x="470" y="362" width="84" height="300" rx="42" fill="#fff"/>
  <circle cx="702" cy="322" r="28" fill="#5ee8b5" filter="url(#brilho)"/>
</svg>
