<script>
  // Aplica o tema antes de pintar, para não piscar
  (function () {
    var pref = 'auto';
    try { pref = localStorage.getItem('sp-theme') || 'auto'; } catch (e) {}
    var dark = pref === 'dark' || (pref === 'auto' && !matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<style>
  /* ───────── Tokens (cores do sistema iOS, versão de contraste reforçado) ───────── */
  :root, [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b1022;
    --card: rgba(22, 24, 34, 0.62);
    --label: #ffffff;
    --label-2: rgba(235, 235, 245, 0.74);
    --sep: rgba(84, 84, 88, 0.65);
    --fill: rgba(120, 120, 128, 0.26);
    --green: #30d158;
    --green-tab: #30d158;
    --green-text: #30d158;
    --red-text: #ffa49e;
    --orange: #ffb340;
    --red: #ff6961;
    --glass: rgba(16, 20, 36, 0.62);
    --glass-strong: rgba(30, 30, 33, 0.74);
    --glass-solid: rgba(28, 28, 30, 0.96);
    --glass-border: rgba(255, 255, 255, 0.16);
    --glass-hi: rgba(255, 255, 255, 0.26);
    --shadow: rgba(0, 0, 0, 0.45);
    --tile-text: #000000;
    --field-1: #12a37a;
    --field-2: #2f4fd1;
    --field-3: #c2416f;
    --field-4: #d98a1f;
    --field-opacity: 0.85;
    --s1: #5ee8b5; --s2: #8fb2ff; --s3: #ffc65c; --s4: #ff9cc2; --s5: #c3adff; --s6: #6fe0f0;
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #eef1f8;
    --card: rgba(255, 255, 255, 0.72);
    --label: #000000;
    --label-2: rgba(60, 60, 67, 0.8);
    --sep: rgba(60, 60, 67, 0.29);
    --fill: rgba(120, 120, 128, 0.14);
    --green: #1e7b34; /* verde iOS escurecido para AA sobre branco */
    --green-tab: #17662a;
    --green-text: #17662a;
    --red-text: #c00013;
    --orange: #c93400;
    --red: #d70015;
    --glass: rgba(255, 255, 255, 0.74);
    --glass-strong: rgba(255, 255, 255, 0.86);
    --glass-solid: rgba(255, 255, 255, 0.97);
    --glass-border: rgba(255, 255, 255, 0.9);
    --glass-hi: rgba(255, 255, 255, 1);
    --shadow: rgba(30, 30, 60, 0.16);
    --tile-text: #ffffff;
    --field-1: #6fdcb4;
    --field-2: #93abff;
    --field-3: #ff9ec0;
    --field-4: #ffc978;
    --field-opacity: 0.9;
    --s1: #057a58; --s2: #2f5bd8; --s3: #9a5c00; --s4: #c43a76; --s5: #7650d6; --s6: #08788b;
  }
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
    --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --side: 16px;
    --tab-h: 62px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); scroll-behavior: smooth; scroll-padding-top: 12px; }
  body {
    font-family: var(--font);
    color: var(--label);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
    line-height: 1.3;
    letter-spacing: -0.01em;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; }

  /* Campos de cor animados por trás de tudo (o que o vidro desfoca) */
  .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg); pointer-events: none; }
  .backdrop span {
    position: absolute; border-radius: 50%;
    filter: blur(70px); opacity: var(--field-opacity);
    animation: drift 28s ease-in-out infinite alternate;
  }
  .backdrop span:nth-child(1) { width: 55vmax; height: 55vmax; left: -15vmax; top: -18vmax; background: var(--field-1); }
  .backdrop span:nth-child(2) { width: 50vmax; height: 50vmax; right: -18vmax; top: -10vmax; background: var(--field-2); animation-duration: 34s; }
  .backdrop span:nth-child(3) { width: 45vmax; height: 45vmax; left: 20vmax; bottom: -25vmax; background: var(--field-3); animation-duration: 40s; }
  .backdrop span:nth-child(4) { width: 28vmax; height: 28vmax; right: 5vmax; bottom: 5vmax; background: var(--field-4); opacity: 0.6; animation-duration: 31s; }
  @keyframes drift { to { transform: translate3d(4vmax, 3vmax, 0) scale(1.08); } }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding:
      calc(env(safe-area-inset-top) + 8px)
      max(var(--side), env(safe-area-inset-right))
      calc(var(--tab-h) + env(safe-area-inset-bottom) + 48px)
      max(var(--side), env(safe-area-inset-left));
  }

  /* ───────── Vidro (Liquid Glass) ───────── */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border: 0.5px solid var(--glass-border);
    box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 rgba(255, 255, 255, 0.04), 0 8px 24px var(--shadow);
  }

  /* ───────── Barra de navegação ───────── */
  .nav { display: flex; justify-content: flex-end; gap: 10px; height: 44px; margin-bottom: 6px; }
  .glass-btn {
    width: 44px; height: 44px; border-radius: 22px;
    display: grid; place-items: center; cursor: pointer;
  }
  .glass-btn svg { width: 20px; height: 20px; }
  .glass-btn:active { transform: scale(0.94); }
  .glass-btn:focus-visible, .reveal:focus-visible, .tab:focus-visible { outline: 2px solid var(--label); outline-offset: 2px; }

  h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.2; }
  /* Texto secundário assenta sempre em vidro, nunca direto sobre a cor */
  .updated {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 6px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 13px; color: var(--label-2);
  }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .live-dot.stale { background: var(--orange); }

  /* ───────── Total ───────── */
  .hero {
    margin-top: 14px;
    border-radius: 34px;
    padding: 18px 18px 18px 20px;
    display: grid;
    gap: 6px;
  }
  .hero-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .label { font-size: 15px; font-weight: 600; color: var(--label-2); }
  .hero .amount {
    font-family: var(--font-round);
    font-size: clamp(38px, 11vw, 48px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    word-break: break-word;
  }
  .status-line { display: flex; flex-wrap: wrap; align-items: center; gap: 0 5px; font-size: 15px; color: var(--label-2); }
  /* Cores de texto de estado: um tom mais forte que o das barras, para ler bem sobre o vidro */
  .st { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--green-text); }
  .st::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st.warning { color: var(--orange); }
  .st.danger { color: var(--red-text); }
  .trend { display: grid; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--label-2); }
  .trend .spark { width: 100%; height: 56px; }
  .trend .up-txt { color: var(--green-text); font-weight: 600; }
  .trend .down-txt { color: var(--red-text); font-weight: 600; }

  /* Botão de revelar (olho) */
  .reveal {
    width: 32px; height: 32px; border-radius: 16px; flex-shrink: 0;
    display: grid; place-items: center;
    border: 0; background: transparent; color: var(--label-2); cursor: pointer;
  }
  .reveal:hover { background: var(--fill); }
  .reveal svg { width: 18px; height: 18px; }
  .is-hidden .amount, .is-hidden .value { letter-spacing: 0.12em; }

  /* ───────── Secções ───────── */
  section { scroll-margin-top: 12px; }
  h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 26px 4px 10px; }

  /* Lista agrupada */
  .list { list-style: none; background: var(--card); border-radius: 26px; overflow: hidden; -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); border: 0.5px solid var(--glass-border); }
  .row {
    --c: var(--s1);
    position: relative;
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 12px;
    min-height: 72px;
    padding: 12px 8px 12px 16px;
  }
  .row + .row::before {
    content: ''; position: absolute; top: 0; left: 64px; right: 0;
    border-top: 0.5px solid var(--sep);
  }
  .tile {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--c); color: var(--tile-text);
    font-family: var(--font-round); font-size: 17px; font-weight: 700;
  }
  .row .text { min-width: 0; display: grid; gap: 2px; }
  .row .name { font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { display: flex; flex-wrap: wrap; align-items: center; gap: 0 5px; font-size: 15px; color: var(--label-2); }
  .row .right { display: grid; justify-items: end; gap: 4px; }
  .row .value { font-family: var(--font-round); font-size: 17px; font-weight: 600; white-space: nowrap; }
  .row .spark { width: 70px; height: 18px; }

  /* Barras de variação diária */
  .spark .base { stroke: var(--sep); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .spark rect.up { fill: var(--green); }
  .spark rect.down { fill: var(--red); }
  .spark rect.flat { fill: var(--label-2); }

  /* Distribuição */
  .dist { background: var(--card); border-radius: 26px; padding: 16px; display: grid; gap: 12px; -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); border: 0.5px solid var(--glass-border); }
  .stack { display: flex; gap: 3px; height: 10px; border-radius: 6px; overflow: hidden; background: var(--fill); }
  .stack i { display: block; height: 100%; min-width: 3px; }
  .legend { list-style: none; display: grid; gap: 10px; }
  .legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 15px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; }
  .legend .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend .val { color: var(--label-2); }

  /* Aviso de erro */
  .notice { display: none; margin-top: 14px; padding: 14px 16px; border-radius: 22px; background: var(--glass-solid); font-size: 15px; }
  .notice strong { color: var(--red); }
  .notice.show { display: block; }

  .foot { margin-top: 22px; text-align: center; }
  .foot span { display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: 13px; color: var(--label-2); }

  /* Carregamento */
  .skeleton {
    color: transparent !important; border-radius: 8px;
    background: linear-gradient(90deg, var(--fill), rgba(127, 127, 127, 0.28), var(--fill));
    background-size: 200% 100%; animation: shimmer 1.4s linear infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ───────── Barra de separadores flutuante ───────── */
  .edge {
    position: fixed; left: 0; right: 0; bottom: 0; height: 140px; pointer-events: none; z-index: 5;
    background: linear-gradient(to bottom, transparent, var(--bg) 92%);
    opacity: 0.7;
  }
  .tabbar {
    position: fixed; z-index: 10;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 12px);
    max-width: 720px; margin: 0 auto;
    padding: 0 max(var(--side), env(safe-area-inset-right)) 0 max(var(--side), env(safe-area-inset-left));
    display: flex; gap: 12px; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .tabbar > * { pointer-events: auto; }
  .tabs {
    display: flex; padding: 4px; border-radius: 31px; height: var(--tab-h);
    background: var(--glass-strong);
  }
  .tab {
    width: 92px; display: grid; place-items: center; align-content: center; gap: 2px;
    border-radius: 27px; text-decoration: none; color: var(--label);
    font-size: 10px; font-weight: 500; letter-spacing: 0.01em;
  }
  .tab svg { width: 24px; height: 24px; }
  .tab[aria-current="true"] { background: var(--fill); color: var(--green-tab); font-weight: 600; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass, .tabs, .list, .dist { background: var(--glass-solid); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .glass, .tabs, .list, .dist { background: var(--glass-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .skeleton, .backdrop span { animation: none; }
  }
</style>

<script>
const SHEET_ID = '1nqvVNdSYHQEpzb5-oUGeUYonAopcTz9SykvjLPUVy3I';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0`;
const REFRESH_MS = 60_000;
// Limites por omissão; cada conta pode ter os seus nas colunas "Aviso" e "Perigo" da folha
const LIMITE_AVISO = 500;
const LIMITE_PERIGO = 100;
const HIST_KEY = 'sp-historico';
const HIST_DIAS = 90;
const SPARK_DIAS = 30;
const DIAS_GRAFICO = 14; // barras de variação diária mostradas
const SERIES = 6;
const MASK = '•••••';

const ESTADOS = {
  '':      { label: 'Saudável' },
  warning: { label: 'Atenção' },
  danger:  { label: 'Baixo' },
};

const euroFmt = new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' });
const euroCurto = new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const pct = new Intl.NumberFormat('pt-PT', { style: 'percent', maximumFractionDigits: 0 });
const hora = new Intl.DateTimeFormat('pt-PT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let lastSuccess = null;
let lastItems = null;
let timer = null;
let lastHist = [];
// Saldos revelados nesta visita; ao recarregar a página voltam todos a estar escondidos
const revealed = new Set();
const TOTAL_KEY = 'total';

/* ───────── Formatação ───────── */
const minus = s => s.replace('-', '−'); // sinal de menos tipográfico
const euro = (v, hidden) => hidden ? MASK : minus(euroFmt.format(v));
const euroDelta = (v, hidden) => hidden ? MASK : (v > 0 ? '+' : '') + minus(euroFmt.format(v));

const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
// Olho fechado = escondido; olho aberto = visível
const revealLabel = (hidden, nome) => `${hidden ? 'Mostrar' : 'Esconder'} saldo ${nome}`;
function revealButton(key, hidden, nome) {
  const label = revealLabel(hidden, nome);
  return `<button class="reveal" type="button" data-reveal="${escapeHTML(key)}" aria-pressed="${!hidden}" aria-label="${escapeHTML(label)}" title="${escapeHTML(label)}">${hidden ? EYE_OFF : EYE}</button>`;
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ───────── Leitura da folha ───────── */
function parseCSVLine(line) {
  const out = [];
  let cur = '', quoted = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (quoted) {
      if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cur += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ',') { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}

function parseValor(raw) {
  if (raw == null) return NaN;
  let s = String(raw).replace(/[\s €]/g, '').replace(/[^\d,.\-]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); // "1.000" = mil
  return parseFloat(s);
}

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();

// Encontra as colunas pelo nome do cabeçalho; sem cabeçalho reconhecido usa A=conta, B=saldo
function columns(header) {
  const h = header.map(norm);
  const find = (...keys) => h.findIndex(c => keys.some(k => c.includes(k)));
  const col = {
    conta: find('conta'),
    saldo: find('saldo', 'valor'),
    aviso: find('aviso', 'atencao'),
    perigo: find('perigo', 'minimo', 'baixo'),
  };
  if (col.conta < 0) col.conta = 0;
  if (col.saldo < 0) col.saldo = col.conta === 0 ? 1 : 0;
  return col;
}

function parseSheet(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const col = columns(parseCSVLine(lines[0]));
  const items = [];
  for (const line of lines.slice(1)) {
    const parts = parseCSVLine(line);
    const conta = (parts[col.conta] || '').trim();
    if (!conta || ['contas', 'conta', 'total'].includes(norm(conta))) continue;
    const saldo = parseValor(parts[col.saldo]);
    if (isNaN(saldo)) continue;
    const aviso = col.aviso >= 0 ? parseValor(parts[col.aviso]) : NaN;
    const perigo = col.perigo >= 0 ? parseValor(parts[col.perigo]) : NaN;
    items.push({
      conta,
      saldo,
      aviso: isNaN(aviso) ? LIMITE_AVISO : aviso,
      perigo: isNaN(perigo) ? LIMITE_PERIGO : perigo,
      proprio: !isNaN(aviso) || !isNaN(perigo),
    });
  }
  return items;
}

function getStatusClass(value, aviso = LIMITE_AVISO, perigo = LIMITE_PERIGO) {
  if (value < perigo) return 'danger';
  if (value < aviso) return 'warning';
  return '';
}

/* ───────── Histórico (guardado neste navegador, um ponto por dia) ───────── */
const hoje = () => new Date().toLocaleDateString('sv-SE'); // AAAA-MM-DD local

function saveHistory(items, total) {
  const hist = store.get(HIST_KEY, []);
  const point = { d: hoje(), t: total, c: Object.fromEntries(items.map(i => [i.conta, i.saldo])) };
  if (hist.length && hist[hist.length - 1].d === point.d) hist[hist.length - 1] = point;
  else hist.push(point);
  store.set(HIST_KEY, hist.slice(-HIST_DIAS));
  return hist;
}

function series(hist, conta) {
  return hist.slice(-SPARK_DIAS)
    .map(p => ({ d: p.d, v: conta == null ? p.t : p.c[conta] }))
    .filter(p => typeof p.v === 'number');
}

// Variação de cada dia face ao dia anterior registado
function dailyChanges(points, max = DIAS_GRAFICO) {
  const out = [];
  for (let i = 1; i < points.length; i++) out.push({ d: points[i].d, delta: points[i].v - points[i - 1].v });
  return out.slice(-max);
}

const diaFmt = new Intl.DateTimeFormat('pt-PT', { weekday: 'short', day: '2-digit', month: '2-digit' });
const diaLabel = d => diaFmt.format(new Date(d + 'T12:00:00')).replace('.', '');
const EPS = 0.005; // abaixo de meio cêntimo conta como "sem alteração"
const dirOf = delta => delta > EPS ? 'up' : delta < -EPS ? 'down' : 'flat';
const DIR_TXT = { up: 'subiu', down: 'desceu', flat: 'sem alteração' };

// Barras por dia: para cima (verde) se subiu, para baixo (vermelho) se desceu
function dailyBars(changes, nome, hidden) {
  if (!changes.length) return '';
  const n = changes.length, slot = 10, bw = 6, h = 32, mid = h / 2, room = mid - 2;
  const maxAbs = Math.max(...changes.map(c => Math.abs(c.delta)), EPS);
  const counts = { up: 0, down: 0, flat: 0 };
  const bars = changes.map((c, i) => {
    const dir = dirOf(c.delta);
    counts[dir]++;
    const x = i * slot + (slot - bw) / 2;
    // raiz quadrada: um dia excecional não esmaga os restantes
    const len = dir === 'flat' ? 2 : Math.max(3, Math.sqrt(Math.abs(c.delta) / maxAbs) * room);
    const y = dir === 'down' ? mid : mid - len;
    const tip = `${diaLabel(c.d)}: ${hidden ? DIR_TXT[dir] : (dir === 'flat' ? 'sem alteração' : euroDelta(c.delta))}`;
    return `<rect class="${dir}" x="${x}" y="${dir === 'flat' ? mid - 1 : y}" width="${bw}" height="${len}" rx="1.5"><title>${escapeHTML(tip)}</title></rect>`;
  }).join('');
  const label = `Evolução diária de ${nome}: ${counts.up} ${counts.up === 1 ? 'dia' : 'dias'} a subir, ${counts.down} a descer, ${counts.flat} sem alteração`;
  return `<svg class="spark days" viewBox="0 0 ${n * slot} ${h}" preserveAspectRatio="none" role="img" aria-label="${escapeHTML(label)}">
    <line class="base" x1="0" x2="${n * slot}" y1="${mid}" y2="${mid}"/>${bars}</svg>`;
}

function trendText(points, hidden) {
  if (points.length < 2) return 'O histórico começa hoje: volta amanhã para ver a evolução por dia.';
  const changes = dailyChanges(points);
  const delta = points[points.length - 1].v - points[points.length - 1 - changes.length].v;
  const up = changes.filter(c => dirOf(c.delta) === 'up').length;
  const down = changes.filter(c => dirOf(c.delta) === 'down').length;
  const dias = changes.length;
  return `<span class="delta">${euroDelta(delta, hidden)}</span> em ${dias} ${dias === 1 ? 'dia' : 'dias'} · <span class="up-txt">${up} a subir</span>, <span class="down-txt">${down} a descer</span>`;
}

/* ───────── Desenho ───────── */
const STATUS_LABEL = { '': 'Saudável', warning: 'Atenção', danger: 'Baixo' };
const statusTag = (status, title) => `<span class="st ${status}"${title ? ` title="${escapeHTML(title)}"` : ''}>${STATUS_LABEL[status]}</span>`;
// Inicial do banco: ignora palavras genéricas ("Conta", "C.C.", "Cartão"…) e usa a primeira palavra que sobra
const GENERICAS = new Set(['conta', 'contas', 'cc', 'cartao', 'cartoes', 'corrente', 'ordem', 'poupanca', 'prazo', 'deposito', 'ordenado', 'de', 'do', 'da', 'dos', 'das', 'e', 'a', 'o']);
function initialOf(nome) {
  const palavras = nome.split(/[\s./\\()\-–—,:;|]+/).filter(Boolean);
  const util = palavras.find(w => w.length > 1 && !GENERICAS.has(norm(w)));
  const fonte = util || nome;
  return (fonte.match(/[\p{L}\p{N}]/u) || ['?'])[0].toUpperCase();
}

// Chaves de tudo o que pode ser revelado: o total e cada conta
const allKeys = items => [TOTAL_KEY, ...items.map(i => i.conta)];
const allRevealed = items => allKeys(items).every(k => revealed.has(k));

function updateRevealAll(items) {
  const b = $('reveal-all');
  const all = allRevealed(items);
  const label = all ? 'Esconder todos os saldos' : 'Mostrar todos os saldos';
  b.hidden = false;
  b.setAttribute('aria-pressed', String(all));
  b.setAttribute('aria-label', label);
  b.title = label;
  b.innerHTML = all ? EYE : EYE_OFF;
}

function render(items) {
  updateRevealAll(items);
  const total = items.reduce((sum, i) => sum + i.saldo, 0);
  const hist = lastHist;
  const totalHidden = !revealed.has(TOTAL_KEY);
  const totalStatus = getStatusClass(total);
  const atencao = items.filter(i => getStatusClass(i.saldo, i.aviso, i.perigo)).length;
  const positivos = items.reduce((s, i) => s + Math.max(i.saldo, 0), 0);
  const color = idx => `var(--s${(idx % SERIES) + 1})`;

  $('dist').hidden = false;

  // Total
  $('total').classList.toggle('is-hidden', totalHidden);
  const rt = $('reveal-total');
  const rtLabel = revealLabel(totalHidden, 'total');
  rt.hidden = false;
  rt.setAttribute('aria-pressed', String(!totalHidden));
  rt.setAttribute('aria-label', rtLabel);
  rt.title = rtLabel;
  rt.innerHTML = totalHidden ? EYE_OFF : EYE;
  $('total-amount').textContent = euro(total, totalHidden);
  $('total-meta').innerHTML = `${statusTag(totalStatus)}<span>· ${items.length} ${items.length === 1 ? 'conta' : 'contas'}${atencao ? ` · ${atencao} a precisar de atenção` : ''}</span>`;
  const totalSerie = series(hist);
  $('total-trend').innerHTML = `${dailyBars(dailyChanges(totalSerie), 'o total', totalHidden)}<span>${trendText(totalSerie, totalHidden)}</span>`;

  // Distribuição
  const shares = items.map(i => positivos > 0 ? Math.max(i.saldo, 0) / positivos : 0);
  document.querySelector('.stack').innerHTML = items
    .map((i, idx) => shares[idx] > 0 ? `<i style="flex-grow:${shares[idx]};background:${color(idx)}" title="${escapeHTML(i.conta)}"></i>` : '')
    .join('');
  $('legend').innerHTML = items
    .map((i, idx) => ({ i, idx, s: shares[idx] }))
    .sort((a, b) => b.s - a.s)
    .map(({ i, idx, s }) => `
      <li>
        <span class="sw" style="background:${color(idx)}" aria-hidden="true"></span>
        <span class="name">${escapeHTML(i.conta)}</span>
        <span class="val">${pct.format(s)}</span>
      </li>`).join('');

  // Contas (lista agrupada)
  $('cards').innerHTML = items.map((i, idx) => {
    const status = getStatusClass(i.saldo, i.aviso, i.perigo);
    const serie = series(hist, i.conta);
    const hidden = !revealed.has(i.conta);
    const tip = hidden ? '' : `${i.proprio ? 'Limites desta conta: ' : ''}atenção abaixo de ${euroCurto.format(i.aviso)} · baixo abaixo de ${euroCurto.format(i.perigo)}`;
    return `
      <li class="row ${status}${hidden ? ' is-hidden' : ''}" style="--c:${color(idx)}">
        <span class="tile" aria-hidden="true">${escapeHTML(initialOf(i.conta))}</span>
        <span class="text">
          <span class="name" title="${escapeHTML(i.conta)}">${escapeHTML(i.conta)}</span>
          <span class="sub">${statusTag(status, tip)}<span>· ${pct.format(shares[idx])}</span></span>
        </span>
        <span class="right">
          <span class="value">${euro(i.saldo, hidden)}</span>
          ${dailyBars(dailyChanges(serie), i.conta, hidden)}
        </span>
        ${revealButton(i.conta, hidden, `de ${i.conta}`)}
      </li>`;
  }).join('');
  markTab();
}

function setUpdated(ok) {
  const dot = $('live-dot');
  if (ok) {
    $('updated').textContent = `Atualizado às ${hora.format(lastSuccess)}`;
    dot.classList.remove('stale');
  } else {
    $('updated').textContent = lastSuccess ? `Último dado às ${hora.format(lastSuccess)}` : 'Sem dados';
    dot.classList.add('stale');
  }
}

async function loadData() {
  const notice = $('notice');
  try {
    const res = await fetch(CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('Não foi possível aceder à folha. Confirma que está partilhada como «Qualquer pessoa com o link pode ver».');
    const items = parseSheet(await res.text());
    if (!items.length) throw new Error('A folha não tem contas com saldo válido.');
    lastItems = items;
    lastHist = saveHistory(items, items.reduce((sum, i) => sum + i.saldo, 0));
    render(items);
    lastSuccess = new Date();
    setUpdated(true);
    notice.classList.remove('show');
  } catch (err) {
    const msg = err instanceof TypeError ? 'Sem ligação à internet ou a folha está inacessível.' : err.message;
    notice.innerHTML = `<strong>Erro ao atualizar.</strong> ${escapeHTML(msg)}${lastSuccess ? ' A mostrar os últimos dados obtidos.' : ''}`;
    notice.classList.add('show');
    if (!lastSuccess) {
      $('total-amount').textContent = '—';
      $('total-meta').innerHTML = '';
      $('total-trend').innerHTML = '';
      $('dist').hidden = true;
      $('cards').innerHTML = '';
      $('reveal-total').hidden = true;
      $('reveal-all').hidden = true;
    }
    setUpdated(false);
  }
}

function schedule() {
  clearInterval(timer);
  timer = setInterval(loadData, REFRESH_MS);
}

/* ───────── Revelar todos (barra de cima) ───────── */
$('reveal-all').addEventListener('click', () => {
  if (!lastItems) return;
  if (allRevealed(lastItems)) revealed.clear();
  else allKeys(lastItems).forEach(k => revealed.add(k));
  render(lastItems);
});

/* ───────── Revelar saldo por cartão ───────── */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-reveal]');
  if (!btn || !lastItems) return;
  const key = btn.dataset.reveal;
  if (revealed.has(key)) revealed.delete(key); else revealed.add(key);
  render(lastItems);
  // A linha é redesenhada: devolver o foco ao mesmo botão
  const again = [...document.querySelectorAll('[data-reveal]')].find(b => b.dataset.reveal === key);
  if (again && document.activeElement !== again) again.focus();
});

/* ───────── Separadores: saltar para a secção e marcar a atual ───────── */
const tabs = [...document.querySelectorAll('.tab')];
function markTab() {
  const line = window.innerHeight * 0.4;
  let current = 'total';
  for (const t of tabs) {
    const sec = document.getElementById(t.dataset.section);
    if (sec && sec.getBoundingClientRect().top < line) current = t.dataset.section;
  }
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) current = tabs[tabs.length - 1].dataset.section;
  for (const t of tabs) t.setAttribute('aria-current', String(t.dataset.section === current));
}
addEventListener('scroll', markTab, { passive: true });
addEventListener('resize', markTab);

/* ───────── Tema: automático → claro → escuro ───────── */
const THEMES = ['auto', 'light', 'dark'];
const THEME_LABEL = { auto: 'automático', light: 'claro', dark: 'escuro' };
const THEME_ICON = {
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>',
};
const systemLight = matchMedia('(prefers-color-scheme: light)');
let themePref = (() => { try { return localStorage.getItem('sp-theme') || 'auto'; } catch { return 'auto'; } })();
if (!THEMES.includes(themePref)) themePref = 'auto';

function applyTheme() {
  const dark = themePref === 'dark' || (themePref === 'auto' && !systemLight.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.querySelector('meta[name="theme-color"]').content = dark ? '#0b1022' : '#eef1f8';
  const b = $('theme');
  const label = `Tema: ${THEME_LABEL[themePref]}`;
  b.setAttribute('aria-label', label);
  b.title = label;
  b.innerHTML = THEME_ICON[themePref];
}
$('theme').addEventListener('click', () => {
  themePref = THEMES[(THEMES.indexOf(themePref) + 1) % THEMES.length];
  try { localStorage.setItem('sp-theme', themePref); } catch {}
  applyTheme();
});
systemLight.addEventListener('change', () => { if (themePref === 'auto') applyTheme(); });

/* ───────── Arranque ───────── */
// Não gastar pedidos com o separador escondido; atualizar ao voltar
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearInterval(timer);
  else { loadData(); schedule(); }
});

applyTheme();
markTab();
loadData();
schedule();
</script>
</body>
</html>
