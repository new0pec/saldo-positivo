<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1022">
<title>Saldo Positivo</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Saldo">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // Aplica o tema antes de pintar, para não piscar
  (function () {
    var pref = 'auto';
    try { pref = localStorage.getItem('sp-theme') || 'auto'; } catch (e) {}
    var dark = pref === 'dark' || (pref === 'auto' && !matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ───────── Tokens ───────── */
  :root, [data-theme="dark"] {
    color-scheme: dark;
    --ink: #0b1022;
    --field-1: #12a37a;
    --field-2: #2f4fd1;
    --field-3: #c2416f;
    --field-4: #d98a1f;
    --field-opacity: 0.85;

    --glass: rgba(14, 20, 44, 0.42);
    --glass-strong: rgba(14, 20, 44, 0.55);
    --glass-solid: rgba(14, 20, 44, 0.90);
    --glass-border: rgba(255, 255, 255, 0.16);
    --glass-highlight: rgba(255, 255, 255, 0.22);
    --glass-shadow: 0 10px 40px -12px rgba(0, 0, 0, 0.45);
    --hover: rgba(255, 255, 255, 0.16);

    --text: #ffffff;
    --text-2: rgba(255, 255, 255, 0.80);
    --track: rgba(255, 255, 255, 0.14);

    --ok: #5ee8b5;
    --warn: #ffc65c;
    --bad: #ff8a8a;
    --pill-bg: rgba(8, 12, 28, 0.55);
    --pill-border: rgba(255, 255, 255, 0.10);
    --notice-bg: rgba(36, 8, 20, 0.70);
    --notice-border: rgba(255, 138, 138, 0.45);
    --notice-strong: #ffa3a3;
    --skeleton-a: rgba(255, 255, 255, 0.08);
    --skeleton-b: rgba(255, 255, 255, 0.18);

    /* Série categórica: uma cor por conta */
    --s1: #5ee8b5;
    --s2: #8fb2ff;
    --s3: #ffc65c;
    --s4: #ff9cc2;
    --s5: #c3adff;
    --s6: #6fe0f0;
  }

  [data-theme="light"] {
    color-scheme: light;
    --ink: #eef1f8;
    --field-1: #6fdcb4;
    --field-2: #93abff;
    --field-3: #ff9ec0;
    --field-4: #ffc978;
    --field-opacity: 0.9;

    --glass: rgba(255, 255, 255, 0.55);
    --glass-strong: rgba(255, 255, 255, 0.70);
    --glass-solid: rgba(255, 255, 255, 0.94);
    --glass-border: rgba(255, 255, 255, 0.75);
    --glass-highlight: rgba(255, 255, 255, 0.95);
    --glass-shadow: 0 10px 40px -14px rgba(20, 30, 70, 0.28);
    --hover: rgba(255, 255, 255, 0.9);

    --text: #0b1022;
    --text-2: rgba(11, 16, 34, 0.74);
    --track: rgba(11, 16, 34, 0.12);

    --ok: #04694a;
    --warn: #7f4c00;
    --bad: #a81c2a;
    --pill-bg: rgba(255, 255, 255, 0.78);
    --pill-border: rgba(11, 16, 34, 0.10);
    --notice-bg: rgba(255, 238, 240, 0.88);
    --notice-border: rgba(168, 28, 42, 0.35);
    --notice-strong: #a81c2a;
    --skeleton-a: rgba(11, 16, 34, 0.06);
    --skeleton-b: rgba(11, 16, 34, 0.14);

    --s1: #079068;
    --s2: #2f5bd8;
    --s3: #b86e00;
    --s4: #c43a76;
    --s5: #7650d6;
    --s6: #0b8aa0;
  }

  :root {
    --blur: 22px;
    --radius: 22px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--ink); }

  body {
    font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    padding: clamp(1.25rem, 4vw, 3rem) clamp(1rem, 4vw, 2rem) 2rem;
    /* Ecrã principal do iPhone: respeitar a zona do relógio e do entalhe */
    padding-top: max(clamp(1.25rem, 4vw, 3rem), calc(env(safe-area-inset-top) + 0.75rem));
    padding-left: max(clamp(1rem, 4vw, 2rem), env(safe-area-inset-left));
    padding-right: max(clamp(1rem, 4vw, 2rem), env(safe-area-inset-right));
    padding-bottom: max(2rem, env(safe-area-inset-bottom));
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }

  /* ───────── Campos de cor (o que o vidro desfoca) ───────── */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: var(--ink);
  }
  .backdrop span {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: var(--field-opacity);
    animation: drift 28s ease-in-out infinite alternate;
  }
  .backdrop span:nth-child(1) { width: 55vmax; height: 55vmax; left: -15vmax; top: -18vmax; background: var(--field-1); }
  .backdrop span:nth-child(2) { width: 50vmax; height: 50vmax; right: -18vmax; top: -10vmax; background: var(--field-2); animation-duration: 34s; }
  .backdrop span:nth-child(3) { width: 45vmax; height: 45vmax; left: 20vmax; bottom: -25vmax; background: var(--field-3); animation-duration: 40s; }
  .backdrop span:nth-child(4) { width: 28vmax; height: 28vmax; right: 5vmax; bottom: 5vmax; background: var(--field-4); opacity: 0.6; animation-duration: 31s; }
  @keyframes drift {
    to { transform: translate3d(4vmax, 3vmax, 0) scale(1.08); }
  }

  .container { max-width: 980px; margin: 0 auto; }

  /* ───────── Componente: vidro ───────── */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
    backdrop-filter: blur(var(--blur)) saturate(150%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: inset 0 1px 0 var(--glass-highlight), var(--glass-shadow);
  }

  /* ───────── Cabeçalho ───────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem 1rem;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }
  h1 {
    font-size: clamp(1.35rem, 3vw, 1.6rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  /* Todo o texto secundário assenta em vidro, nunca direto sobre a cor */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.875rem;
    color: var(--text-2);
    padding: 0.3rem;
    border-radius: 999px;
  }
  .toolbar .when {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0 0.4rem 0 0.6rem;
    white-space: nowrap;
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent);
    flex-shrink: 0;
  }
  .live-dot.stale { background: var(--warn); box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 20%, transparent); }

  .btn {
    font: inherit;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text);
    height: 34px;
    min-width: 34px;
    padding: 0 0.9rem;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    background: var(--glass-strong);
    border: 1px solid var(--glass-border);
    transition: background 0.2s;
  }
  .btn.icon { padding: 0; width: 34px; }
  .btn svg { width: 18px; height: 18px; }
  .btn:hover { background: var(--hover); }
  .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .btn[disabled] { cursor: progress; }
  .btn[aria-pressed="true"] { background: var(--text); color: var(--ink); border-color: transparent; }

  /* ───────── Componente: total ───────── */
  .hero {
    padding: clamp(1.4rem, 4vw, 2.2rem);
    margin-bottom: 1rem;
    display: grid;
    gap: 1.5rem 2.5rem;
  }
  @media (min-width: 760px) {
    .hero { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: center; }
  }
  .hero-main { display: grid; gap: 0.35rem; min-width: 0; }
  .label {
    font-size: 0.8125rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-2);
  }
  .hero .amount {
    font-size: clamp(2.5rem, 7vw, 4rem);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.05;
  }
  .hero-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem 0.75rem;
    flex-wrap: wrap;
    margin-top: 0.5rem;
    color: var(--text-2);
    font-size: 0.9375rem;
  }
  .trend {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.75rem;
    color: var(--text-2);
    font-size: 0.875rem;
  }
  .trend .spark { width: 120px; height: 32px; color: var(--text); flex-shrink: 0; }

  /* Distribuição: barra empilhada + legenda */
  .dist { display: grid; gap: 0.9rem; min-width: 0; }
  .stack {
    display: flex;
    gap: 3px;
    height: 12px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--track);
  }
  .stack i { display: block; height: 100%; min-width: 3px; transition: flex-grow 0.6s ease; }
  .legend {
    list-style: none;
    display: grid;
    gap: 0.45rem;
    font-size: 0.875rem;
  }
  .legend li {
    display: grid;
    grid-template-columns: 10px minmax(0, 1fr) auto;
    align-items: center;
    gap: 0.6rem;
  }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; }
  .legend .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend .val { color: var(--text-2); }

  /* ───────── Componente: pílula de estado (texto + cor, nunca só cor) ───────── */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.2rem 0.65rem 0.2rem 0.55rem;
    border-radius: 999px;
    font-size: 0.8125rem;
    font-weight: 700;
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    color: var(--ok);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .pill::before {
    content: '';
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor;
  }
  .pill.warning { color: var(--warn); }
  .pill.danger { color: var(--bad); }

  /* ───────── Componente: cartão de conta ───────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
  }
  .card {
    --c: var(--s1);
    padding: 1.15rem 1.25rem 1.2rem;
    display: grid;
    gap: 0.55rem;
    position: relative;
    overflow: hidden;
    min-width: 0;
  }
  .card > * { min-width: 0; }
  /* Brilho de estado no canto, por trás do conteúdo */
  .card::after {
    content: '';
    position: absolute;
    width: 140px; height: 140px;
    right: -50px; top: -60px;
    border-radius: 50%;
    background: var(--ok);
    opacity: 0.16;
    filter: blur(30px);
    pointer-events: none;
  }
  .card.warning::after { background: var(--warn); }
  .card.danger::after { background: var(--bad); opacity: 0.2; }
  .card-head {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .card h2 {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;
    font-size: 1rem;
    font-weight: 600;
  }
  .card h2 .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex-shrink: 0; }
  .card h2 .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .amount-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 0.75rem;
  }
  .card .amount {
    font-size: 1.875rem;
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.15;
    white-space: nowrap;
  }
  .card .spark { width: 84px; height: 28px; color: var(--c); flex-shrink: 0; }
  .meta {
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    font-size: 0.8125rem;
    color: var(--text-2);
  }
  .meta span:last-child { text-align: right; }
  .bar {
    height: 4px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: var(--c);
    transition: width 0.6s ease;
  }

  /* Mini-gráfico */
  .spark path.line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .spark path.area { fill: currentColor; opacity: 0.14; stroke: none; }
  .spark circle { fill: currentColor; }

  /* Valores escondidos */
  /* Saldo escondido (por omissão em todos os cartões) */
  .is-hidden .amount, .is-hidden .trend .delta, .is-hidden .limits { letter-spacing: 0.08em; }

  /* Botão de revelar, no canto superior direito de cada cartão */
  .reveal {
    flex-shrink: 0;
    width: 30px; height: 30px;
    display: inline-grid; place-items: center;
    border-radius: 999px;
    color: var(--text);
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    cursor: pointer;
    transition: background 0.2s;
  }
  .reveal svg { width: 16px; height: 16px; }
  .reveal:hover { background: var(--hover); }
  .reveal:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .hero { position: relative; }
  .hero > .reveal { position: absolute; top: 14px; right: 14px; }
  .card-head .pill { margin-left: auto; }

  /* ───────── Aviso de erro ───────── */
  .notice {
    display: none;
    padding: 0.9rem 1.1rem;
    margin-bottom: 1rem;
    border-color: var(--notice-border);
    background: var(--notice-bg);
    font-size: 0.9375rem;
  }
  .notice strong { color: var(--notice-strong); }
  .notice.show { display: block; }

  /* ───────── Carregamento ───────── */
  .skeleton {
    color: transparent !important;
    background: linear-gradient(90deg, var(--skeleton-a), var(--skeleton-b), var(--skeleton-a));
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
    border-radius: 8px;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  footer { margin-top: 1.5rem; text-align: center; }
  footer p {
    display: inline-block;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    font-size: 0.8125rem;
    color: var(--text-2);
  }

  [hidden] { display: none !important; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* Sem blur, ou quem prefere menos transparência: vidro sólido */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass { background: var(--glass-solid); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .glass { background: var(--glass-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .backdrop span, .skeleton { animation: none; }
    .bar i, .stack i { transition: none; }
  }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <div class="container">
    <header>
      <h1>Saldo Positivo</h1>
      <div class="glass toolbar">
        <span class="when"><span class="live-dot" id="live-dot" aria-hidden="true"></span><span id="updated" role="status">A carregar…</span></span>
        <button class="btn icon" id="theme" type="button" aria-label="Tema: automático" title="Tema: automático"></button>
      </div>
    </header>

    <div class="glass notice" id="notice" role="alert"></div>

    <main id="main">
      <section class="glass hero is-hidden" id="hero" aria-labelledby="total-label">
        <button class="reveal" id="reveal-total" type="button" data-reveal="total" aria-pressed="false" hidden></button>
        <div class="hero-main">
          <span class="label" id="total-label">Total disponível</span>
          <div class="amount" id="total-amount" aria-live="polite"><span class="skeleton">0 000,00 €</span></div>
          <div class="hero-meta" id="total-meta"></div>
          <div class="trend" id="total-trend"></div>
        </div>
        <div class="dist" id="dist" aria-labelledby="dist-label">
          <span class="label" id="dist-label">Distribuição</span>
          <div class="stack"><i class="skeleton" style="flex-grow:1"></i></div>
          <ul class="legend" id="legend"></ul>
        </div>
      </section>

      <h2 class="sr-only">Contas</h2>
      <div class="grid" id="cards">
        <div class="glass card"><div class="card-head"><h2><span class="skeleton">Conta</span></h2></div><div class="amount"><span class="skeleton">000,00 €</span></div></div>
        <div class="glass card"><div class="card-head"><h2><span class="skeleton">Conta</span></h2></div><div class="amount"><span class="skeleton">000,00 €</span></div></div>
        <div class="glass card"><div class="card-head"><h2><span class="skeleton">Conta</span></h2></div><div class="amount"><span class="skeleton">000,00 €</span></div></div>
      </div>
    </main>

    <footer><p class="glass">Dados lidos da Google Sheet · atualização automática a cada minuto</p></footer>
  </div>

<script>
const SHEET_ID = '1nqvVNdSYHQEpzb5-oUGeUYonAopcTz9SykvjLPUVy3I';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0`;
const REFRESH_MS = 60_000;
// Limites por omissão; cada conta pode ter os seus nas colunas "Aviso" e "Perigo" da folha
const LIMITE_AVISO = 500;
const LIMITE_PERIGO = 100;
const HIST_KEY = 'sp-historico';
const HIST_DIAS = 90;
const SPARK_DIAS = 30;
const SERIES = 6;
const MASK = '•••••';

const ESTADOS = {
  '':      { label: 'Saudável' },
  warning: { label: 'Atenção' },
  danger:  { label: 'Baixo' },
};

const euroFmt = new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' });
const euroCurto = new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const pct = new Intl.NumberFormat('pt-PT', { style: 'percent', maximumFractionDigits: 0 });
const hora = new Intl.DateTimeFormat('pt-PT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let lastSuccess = null;
let lastItems = null;
let timer = null;
let lastHist = [];
// Saldos revelados nesta visita; ao recarregar a página voltam todos a estar escondidos
const revealed = new Set();
const TOTAL_KEY = 'total';

/* ───────── Formatação ───────── */
const minus = s => s.replace('-', '−'); // sinal de menos tipográfico
const euro = (v, hidden) => hidden ? MASK : minus(euroFmt.format(v));
const euroDelta = (v, hidden) => hidden ? MASK : (v > 0 ? '+' : '') + minus(euroFmt.format(v));

const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
// Olho fechado = escondido; olho aberto = visível
const revealLabel = (hidden, nome) => `${hidden ? 'Mostrar' : 'Esconder'} saldo ${nome}`;
function revealButton(key, hidden, nome) {
  const label = revealLabel(hidden, nome);
  return `<button class="reveal" type="button" data-reveal="${escapeHTML(key)}" aria-pressed="${!hidden}" aria-label="${escapeHTML(label)}" title="${escapeHTML(label)}">${hidden ? EYE_OFF : EYE}</button>`;
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ───────── Leitura da folha ───────── */
function parseCSVLine(line) {
  const out = [];
  let cur = '', quoted = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (quoted) {
      if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cur += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ',') { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}

function parseValor(raw) {
  if (raw == null) return NaN;
  let s = String(raw).replace(/[\s €]/g, '').replace(/[^\d,.\-]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); // "1.000" = mil
  return parseFloat(s);
}

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();

// Encontra as colunas pelo nome do cabeçalho; sem cabeçalho reconhecido usa A=conta, B=saldo
function columns(header) {
  const h = header.map(norm);
  const find = (...keys) => h.findIndex(c => keys.some(k => c.includes(k)));
  const col = {
    conta: find('conta'),
    saldo: find('saldo', 'valor'),
    aviso: find('aviso', 'atencao'),
    perigo: find('perigo', 'minimo', 'baixo'),
  };
  if (col.conta < 0) col.conta = 0;
  if (col.saldo < 0) col.saldo = col.conta === 0 ? 1 : 0;
  return col;
}

function parseSheet(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const col = columns(parseCSVLine(lines[0]));
  const items = [];
  for (const line of lines.slice(1)) {
    const parts = parseCSVLine(line);
    const conta = (parts[col.conta] || '').trim();
    if (!conta || ['contas', 'conta', 'total'].includes(norm(conta))) continue;
    const saldo = parseValor(parts[col.saldo]);
    if (isNaN(saldo)) continue;
    const aviso = col.aviso >= 0 ? parseValor(parts[col.aviso]) : NaN;
    const perigo = col.perigo >= 0 ? parseValor(parts[col.perigo]) : NaN;
    items.push({
      conta,
      saldo,
      aviso: isNaN(aviso) ? LIMITE_AVISO : aviso,
      perigo: isNaN(perigo) ? LIMITE_PERIGO : perigo,
      proprio: !isNaN(aviso) || !isNaN(perigo),
    });
  }
  return items;
}

function getStatusClass(value, aviso = LIMITE_AVISO, perigo = LIMITE_PERIGO) {
  if (value < perigo) return 'danger';
  if (value < aviso) return 'warning';
  return '';
}

/* ───────── Histórico (guardado neste navegador, um ponto por dia) ───────── */
const hoje = () => new Date().toLocaleDateString('sv-SE'); // AAAA-MM-DD local

function saveHistory(items, total) {
  const hist = store.get(HIST_KEY, []);
  const point = { d: hoje(), t: total, c: Object.fromEntries(items.map(i => [i.conta, i.saldo])) };
  if (hist.length && hist[hist.length - 1].d === point.d) hist[hist.length - 1] = point;
  else hist.push(point);
  store.set(HIST_KEY, hist.slice(-HIST_DIAS));
  return hist;
}

function series(hist, conta) {
  return hist.slice(-SPARK_DIAS)
    .map(p => conta == null ? p.t : p.c[conta])
    .filter(v => typeof v === 'number');
}

function sparkline(values, label) {
  if (values.length < 2) return '';
  const w = 100, h = 30, pad = 3;
  const min = Math.min(...values), max = Math.max(...values);
  const span = max - min || 1;
  const pts = values.map((v, i) => [
    (i / (values.length - 1)) * w,
    h - pad - ((v - min) / span) * (h - pad * 2),
  ]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = `${line} L${w} ${h} L0 ${h} Z`;
  const [lx, ly] = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${escapeHTML(label)}">
    <path class="area" d="${area}"/><path class="line" d="${line}"/>
    <circle cx="${lx}" cy="${ly}" r="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}

function trendText(values, hidden) {
  if (values.length < 2) return 'O histórico começa hoje: volta amanhã para ver a evolução.';
  const delta = values[values.length - 1] - values[0];
  const dias = values.length - 1;
  return `<span class="delta">${euroDelta(delta, hidden)}</span> nos últimos ${dias} ${dias === 1 ? 'dia' : 'dias'}`;
}

/* ───────── Desenho ───────── */
function pill(status, title) {
  return `<span class="pill ${status}"${title ? ` title="${escapeHTML(title)}"` : ''}>${ESTADOS[status].label}</span>`;
}

function render(items) {
  const total = items.reduce((sum, i) => sum + i.saldo, 0);
  const hist = lastHist;
  const totalHidden = !revealed.has(TOTAL_KEY);
  const totalStatus = getStatusClass(total);
  const atencao = items.filter(i => getStatusClass(i.saldo, i.aviso, i.perigo)).length;
  const positivos = items.reduce((s, i) => s + Math.max(i.saldo, 0), 0);
  const color = idx => `var(--s${(idx % SERIES) + 1})`;

  $('dist').hidden = false;

  // Total
  $('hero').classList.toggle('is-hidden', totalHidden);
  const rt = $('reveal-total');
  const rtLabel = revealLabel(totalHidden, 'total');
  rt.hidden = false;
  rt.setAttribute('aria-pressed', String(!totalHidden));
  rt.setAttribute('aria-label', rtLabel);
  rt.title = rtLabel;
  rt.innerHTML = totalHidden ? EYE_OFF : EYE;
  $('total-amount').textContent = euro(total, totalHidden);
  $('total-meta').innerHTML = `
    ${pill(totalStatus)}
    <span>${items.length} ${items.length === 1 ? 'conta' : 'contas'}${atencao ? ` · ${atencao} a precisar de atenção` : ''}</span>`;
  const totalSerie = series(hist);
  $('total-trend').innerHTML = `${totalHidden ? '' : sparkline(totalSerie, 'Evolução do total')}<span>${trendText(totalSerie, totalHidden)}</span>`;

  // Distribuição
  const shares = items.map(i => positivos > 0 ? Math.max(i.saldo, 0) / positivos : 0);
  document.querySelector('.stack').innerHTML = items
    .map((i, idx) => shares[idx] > 0 ? `<i style="flex-grow:${shares[idx]};background:${color(idx)}" title="${escapeHTML(i.conta)}"></i>` : '')
    .join('');
  $('legend').innerHTML = items
    .map((i, idx) => ({ i, idx, s: shares[idx] }))
    .sort((a, b) => b.s - a.s)
    .map(({ i, idx, s }) => `
      <li>
        <span class="sw" style="background:${color(idx)}" aria-hidden="true"></span>
        <span class="name">${escapeHTML(i.conta)}</span>
        <span class="val">${pct.format(s)}</span>
      </li>`).join('');

  // Contas
  $('cards').innerHTML = items.map((i, idx) => {
    const status = getStatusClass(i.saldo, i.aviso, i.perigo);
    const share = shares[idx];
    const serie = series(hist, i.conta);
    const hidden = !revealed.has(i.conta);
    const limites = hidden
      ? `alerta ${MASK}`
      : `alerta abaixo de ${euroCurto.format(i.aviso)}`;
    return `
      <article class="glass card ${status}${hidden ? ' is-hidden' : ''}" style="--c:${color(idx)}">
        <div class="card-head">
          <h2 title="${escapeHTML(i.conta)}"><span class="sw" aria-hidden="true"></span><span class="name">${escapeHTML(i.conta)}</span></h2>
          ${pill(status, hidden ? '' : `Atenção abaixo de ${euroCurto.format(i.aviso)} · baixo abaixo de ${euroCurto.format(i.perigo)}`)}
          ${revealButton(i.conta, hidden, `de ${i.conta}`)}
        </div>
        <div class="amount-row">
          <div class="amount">${euro(i.saldo, hidden)}</div>
          ${hidden ? '' : sparkline(serie, `Evolução de ${i.conta}`)}
        </div>
        <div class="meta">
          <span>${pct.format(share)} do total</span>
          <span class="limits">${i.proprio ? limites : ''}</span>
        </div>
        <div class="bar" aria-hidden="true"><i style="width:${(share * 100).toFixed(1)}%"></i></div>
      </article>`;
  }).join('');
}

function setUpdated(ok) {
  const dot = $('live-dot');
  if (ok) {
    $('updated').textContent = `Atualizado às ${hora.format(lastSuccess)}`;
    dot.classList.remove('stale');
  } else {
    $('updated').textContent = lastSuccess ? `Último dado às ${hora.format(lastSuccess)}` : 'Sem dados';
    dot.classList.add('stale');
  }
}

async function loadData() {
  const notice = $('notice');
  try {
    const res = await fetch(CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('Não foi possível aceder à folha. Confirma que está partilhada como «Qualquer pessoa com o link pode ver».');
    const items = parseSheet(await res.text());
    if (!items.length) throw new Error('A folha não tem contas com saldo válido.');
    lastItems = items;
    lastHist = saveHistory(items, items.reduce((sum, i) => sum + i.saldo, 0));
    render(items);
    lastSuccess = new Date();
    setUpdated(true);
    notice.classList.remove('show');
  } catch (err) {
    const msg = err instanceof TypeError ? 'Sem ligação à internet ou a folha está inacessível.' : err.message;
    notice.innerHTML = `<strong>Erro ao atualizar.</strong> ${escapeHTML(msg)}${lastSuccess ? ' A mostrar os últimos dados obtidos.' : ''}`;
    notice.classList.add('show');
    if (!lastSuccess) {
      $('total-amount').textContent = '—';
      $('total-meta').innerHTML = '';
      $('total-trend').innerHTML = '';
      $('dist').hidden = true;
      $('cards').innerHTML = '';
      $('reveal-total').hidden = true;
    }
    setUpdated(false);
  }
}

function schedule() {
  clearInterval(timer);
  timer = setInterval(loadData, REFRESH_MS);
}

/* ───────── Revelar saldo por cartão ───────── */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-reveal]');
  if (!btn || !lastItems) return;
  const key = btn.dataset.reveal;
  if (revealed.has(key)) revealed.delete(key); else revealed.add(key);
  render(lastItems);
  // O cartão é redesenhado: devolver o foco ao mesmo botão
  const again = [...document.querySelectorAll('[data-reveal]')].find(b => b.dataset.reveal === key);
  if (again && document.activeElement !== again) again.focus();
});

/* ───────── Tema: automático → claro → escuro ───────── */
const THEMES = ['auto', 'light', 'dark'];
const THEME_LABEL = { auto: 'automático', light: 'claro', dark: 'escuro' };
const THEME_ICON = {
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>',
};
const systemLight = matchMedia('(prefers-color-scheme: light)');
let themePref = (() => { try { return localStorage.getItem('sp-theme') || 'auto'; } catch { return 'auto'; } })();
if (!THEMES.includes(themePref)) themePref = 'auto';

function applyTheme() {
  const dark = themePref === 'dark' || (themePref === 'auto' && !systemLight.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.querySelector('meta[name="theme-color"]').content = dark ? '#0b1022' : '#eef1f8';
  const b = $('theme');
  const label = `Tema: ${THEME_LABEL[themePref]}`;
  b.setAttribute('aria-label', label);
  b.title = label;
  b.innerHTML = THEME_ICON[themePref];
}
$('theme').addEventListener('click', () => {
  themePref = THEMES[(THEMES.indexOf(themePref) + 1) % THEMES.length];
  try { localStorage.setItem('sp-theme', themePref); } catch {}
  applyTheme();
});
systemLight.addEventListener('change', () => { if (themePref === 'auto') applyTheme(); });

/* ───────── Arranque ───────── */
// Não gastar pedidos com o separador escondido; atualizar ao voltar
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearInterval(timer);
  else { loadData(); schedule(); }
});

applyTheme();
loadData();
schedule();
</script>
</body>
</html>
